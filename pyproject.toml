[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json2csv-lite"
version = "0.1.0"
description = "Tiny, dependency-free JSON to CSV converter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sara", email = "saraasaalari@yahoo.com" }]
keywords = ["json", "csv", "converter", "serialization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/sarahsalary/json2csv-lite"
Repository = "https://github.com/sarahsalary/json2csv-lite"
Issues = "https://github.com/sarahsalary/json2csv-lite/issues"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
